### 3. Caddy Configuration (Reverse Proxy)
Create a file named `Caddyfile` in a folder named `caddy` next to your compose file.

```caddy
# caddy/Caddyfile

{
    email admin@yourdomain.com
}

# Authentik
auth.{$DOMAIN} {
    reverse_proxy authentik-server:9000
}

# Medusa Backend
app.{$DOMAIN} {
    reverse_proxy medusa:9000
}

# PocketBase
pb.{$DOMAIN} {
    reverse_proxy pocketbase:8090
}
```

---

### 4. Integration Instructions

Since this is a "production-ready" stack, you cannot simply run `docker-compose up` and have everything talk to each other magically. You must configure the providers.

#### Step 1: Start the Stack
```bash
docker-compose up -d
```
Wait for images to pull and services to start.

#### Step 2: Configure Authentik
1.  Go to `https://auth.yourdomain.com` (if DNS is set) or `http://localhost:9000` (if testing locally with port mapping).
2.  Complete the setup wizard (create admin user).
3.  **Create Application:**
    *   Go to **Admin** -> **Applications** -> **Create**.
    *   Name: `Medusa`.
    *   Slug: `medusa`.
    *   Type: **Provider (OAuth2/OpenID)**.
    *   Redirect URIs: `https://app.yourdomain.com/auth/authentik/callback` (This assumes you have installed the Medusa Authentik plugin).

#### Step 3: Configure Medusa
You need to install the Authentik authentication plugin in your Medusa project. If you are using the official Docker image, you will likely need to create a custom `Dockerfile` to install the npm package `@medusajs/auth-authentik`.

Add to your Medusa `config.json`:
```json
{
  "modules": {
    "auth": {
      "authentik": {
        "domain": "https://auth.yourdomain.com",
        "clientId": "YOUR_CLIENT_ID_FROM_AUTHENTIK",
        "clientSecret": "YOUR_CLIENT_SECRET_FROM_AUTHENTIK",
        "callbackUrl": "https://app.yourdomain.com/auth/authentik/callback"
      }
    }
  }
}
```

### Important Considerations
1.  **Cron Jobs:** Medusa relies heavily on cron jobs for order processing. In Docker, you usually need to run a separate "worker" container or define a cron entrypoint in your Medusa service definition to handle `medusa execute`.
2.  **PocketBase Persistence:** PocketBase stores data in `pb_data`. I have mapped this to a Docker volume. Note that PocketBase uses SQLite internally, so it does not actually connect to the PostgreSQL service defined in this stack, keeping it lightweight and independent.
3.  **DNS:** For SSL (Caddy) to work automatically, the domains in `.env` must point to the server IP.
