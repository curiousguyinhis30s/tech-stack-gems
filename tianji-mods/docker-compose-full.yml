Here is a complete, production-ready Docker Compose setup for **Tianji**, incorporating all the requested enhancements including ClickHouse for analytics, Redis for performance, and PostgreSQL for data persistence.

### 1. `docker-compose-full.yml`
This file defines the entire stack. It includes an optional Caddy reverse proxy to handle SSL automatically and act as a privacy edge proxy if needed.

```yaml
version: '3.8'

services:
  # 1. PostgreSQL - Primary Database
  db:
    image: postgres:16-alpine
    container_name: tianji_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tianji}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-tianji}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tianji}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  # 2. Redis - Caching & WebSocket Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: tianji_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  # 3. ClickHouse - Analytics Engine (High Performance)
  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: tianji_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: tianji
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Optional: Custom config for performance tuning
      # - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal_net

  # 4. Tianji - Main Application
  tianji:
    image: moonrailgun/tianji:latest
    container_name: tianji_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      # Basics
      TZ: ${TZ:-UTC}
      
      # Database Connections
      DATABASE_URL: postgresql://${DB_USER:-tianji}:${DB_PASSWORD}@db:5432/${DB_NAME:-tianji}
      
      # ClickHouse Connection
      # Ensure ClickHouse protocol is native
      CLICKHOUSE_URL: clickhouse://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/tianji
      
      # Redis Connection
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # App Config
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_OPENAI: ${ALLOW_OPENAI:-false}
      
      # Base URL (Required for Email links/Callback)
      # IMPORTANT: Set this to your domain, e.g., https://analytics.yourdomain.com
      BASE_URL: ${BASE_URL:-http://localhost:12345}
    ports:
      - "12345:12345"
    volumes:
      # Persist uploaded files/logs
      - tianji_data:/app/data
    networks:
      - internal_net

  # 5. Edge Proxy (Caddy) - Optional but recommended
  # Handles SSL, GZip, and acts as a privacy shield
  caddy:
    image: caddy:2-alpine
    container_name: tianji_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy_data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - internal_net
      # If you have an external web network, add it here

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
  tianji_data:
    driver: local

networks:
  internal_net:
    driver: bridge
```

### 2. `.env.example`
Copy this file to `.env` and fill in the secure values. **Do not use default passwords in production.**

```bash
# --- TimeZone ---
TZ=UTC

# --- Application Security ---
# Generate a strong random string here
JWT_SECRET=change_this_to_random_64_char_string

# --- Public URL ---
# Tianji needs to know its own public URL for callback/links
BASE_URL=https://analytics.yourdomain.com

# --- PostgreSQL ---
DB_USER=tianji
DB_PASSWORD=secure_postgres_password
DB_NAME=tianji

# --- Redis ---
REDIS_PASSWORD=secure_redis_password

# --- ClickHouse ---
CLICKHOUSE_USER=default
CLICKHOUSE_PASSWORD=secure_clickhouse_password

# --- Features ---
# Set to true if you want to enable AI features integration
ALLOW_OPENAI=false
```

### 3. `Caddyfile` (Edge Proxy Config)
Save this as `Caddyfile` in the same directory. Replace `analytics.yourdomain.com` with your actual domain.

```caddyfile
# Replace with your domain
analytics.yourdomain.com {
    # Optional: Basic Auth to block bots/scrapers entirely
    # basicauth {
    #     admin $2a$14$... # Generate with: caddy hash-password
    # }

    reverse_proxy tianji_app:12345
    
    # Log to stdout for docker logs
    log {
        output file /data/access.log
    }
}

# Optional: HTTP to HTTPS redirect
http://analytics.yourdomain.com {
    redir https://analytics.yourdomain.com{uri} permanent
}
```

### 4. `setup.sh`
This script prepares the environment, generates secrets, and launches the stack.

```bash
#!/bin/bash

set -e

echo "🚀 Starting Tianji Stack Setup..."

# 1. Check if .env exists, if not, copy example
if [ ! -f .env ]; then
    echo "📄 Creating .env file from template..."
    cp .env.example .env
    
    # Generate secure secrets automatically
    JWT_SECRET=$(openssl rand -hex 32)
    DB_PASSWORD=$(openssl rand -hex 16)
    REDIS_PASSWORD=$(openssl rand -hex 16)
    CLICKHOUSE_PASSWORD=$(openssl rand -hex 16)

    # Update .env (Linux/macOS compatible)
    sed -i "s/JWT_SECRET=.*/JWT_SECRET=$JWT_SECRET/" .env
    sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=$DB_PASSWORD/" .env
    sed -i "s/REDIS_PASSWORD=.*/REDIS_PASSWORD=$REDIS_PASSWORD/" .env
    sed -i "s/CLICKHOUSE_PASSWORD=.*/CLICKHOUSE_PASSWORD=$CLICKHOUSE_PASSWORD/" .env
    
    echo "✅ Generated secure passwords. Please review .env file."
else
    echo "✅ .env file already exists."
fi

# 2. Create necessary directories for Caddy
mkdir -p caddy_data

# 3. Pull latest images
echo "🐳 Pulling latest Docker images..."
docker-compose -f docker-compose-full.yml pull

# 4. Start the stack
echo "🚀 Starting containers..."
docker-compose -f docker-compose-full.yml up -d

echo "✨ Setup complete! Check logs with: docker-compose -f docker-compose-full.yml logs -f"
```

### 5. `test-stack.sh`
This script verifies that all services are running and healthy.

```bash
#!/bin/bash

echo "🔍 Validating Tianji Stack..."

SERVICES=("tianji_db" "tianji_redis" "tianji_clickhouse" "tianji_app")
ALL_GOOD=true

for SERVICE in "${SERVICES[@]}"; do
    if docker ps --filter "name=$SERVICE" --filter "status=running" | grep -q $SERVICE; then
        echo "✅ $SERVICE is running."
    else
        echo "❌ $SERVICE is NOT running."
        ALL_GOOD=false
    fi
done

# Check Caddy if it exists
if docker ps --filter "name=tianji_proxy" --filter "status=running" | grep -q tianji_proxy; then
    echo "✅ Edge Proxy (Caddy) is running."
fi

# Check App Connectivity
# We use curl inside the app container to check itself
if docker exec tianji_app wget --quiet --tries=1 --spider http://localhost:12345; then
    echo "✅ Tianji App is responding locally."
else
    echo "⚠️  Tianji App is not responding locally (might still be starting up)."
    ALL_GOOD=false
fi

if [ "$ALL_GOOD" = true ]; then
    echo "🎉 Stack looks healthy!"
    exit 0
else
    echo "⚠️  Some services have issues. Check 'docker-compose logs'."
    exit 1
fi
```

---

### How to use:

1.  Create a folder for your project.
2.  Save `docker-compose-full.yml` as `docker-compose.yml` in that folder.
3.  Save the `.env.example` and `setup.sh` contents into files in that folder.
4.  Make the scripts executable:
    ```bash
    chmod +x setup.sh test-stack.sh
    ```
5.  Run the setup:
    ```bash
    ./setup.sh
    ```
6.  Run the health check (wait ~15 seconds after setup for ClickHouse to initialize):
    ```bash
    ./test-stack.sh
    ```
