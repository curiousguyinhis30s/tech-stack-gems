# Ansible Inventory - Command Center Infrastructure
# Contabo VPS: 5.189.136.56
# Both staging and production on same VPS, different directories

all:
  children:
    # Production environment
    production:
      hosts:
        contabo-prod:
          ansible_host: 5.189.136.56
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          app_dir: /var/www/production
          domain: sami.now
          env_name: production

    # Staging environment (same VPS, different directory)
    staging:
      hosts:
        contabo-staging:
          ansible_host: 5.189.136.56
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          app_dir: /var/www/staging
          domain: staging.sami.now
          env_name: staging

    # Local development
    local:
      hosts:
        localhost:
          ansible_connection: local
          app_dir: /Users/samiullah/projects
          env_name: development

  # Global variables (shared across all environments)
  vars:
    # ntfy.sh notifications
    ntfy_topic: "command-center"
    ntfy_server: "https://ntfy.sh"

    # Node.js
    node_version: "20"

    # PM2 settings
    pm2_instances: 1
    pm2_memory_limit: "512M"

    # PocketBase (for command center apps)
    pocketbase_port: 8090

    # Backup settings
    backup_dir: /var/backups
    backup_retention_days: 7

    # Health check
    health_check_timeout: 30
