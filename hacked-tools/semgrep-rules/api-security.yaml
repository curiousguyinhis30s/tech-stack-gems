rules:
  - id: express-missing-auth-middleware
    languages: [javascript, typescript]
    message: "Publicly exposed route detected. This HTTP route does not appear to implement authentication middleware."
    severity: WARNING
    patterns:
      - pattern-regex: '(app|router)\.(get|post|put|delete|patch)\s*\(\s*[''"]\/[^''"]*[''"]\s*,'
    metadata:
      category: security
      technology:
        - express
        - node.js
      cwe: "CWE-306: Missing Authentication"

  - id: react-dangerously-set-inner-html
    languages: [javascript, typescript, jsx, tsx]
    message: "Usage of dangerouslySetInnerHTML detected. XSS risk if input not sanitized."
    severity: ERROR
    pattern: dangerouslySetInnerHTML
    metadata:
      category: security
      technology:
        - react
      owasp: "A03:2021 – Injection"
      cwe: "CWE-79: XSS"

  - id: node-command-injection
    languages: [javascript, typescript]
    message: "child_process.exec() is vulnerable to command injection. Use execFile or spawn."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: child_process.exec(...)
          - pattern: child_process.execSync(...)
          - pattern: require('child_process').exec(...)
          - pattern: require('child_process').execSync(...)
    metadata:
      category: security
      technology:
        - node.js
      owasp: "A03:2021 – Injection"
      cwe: "CWE-78: OS Command Injection"

  - id: node-path-traversal
    languages: [javascript, typescript]
    message: "Path traversal vulnerability. User input in file paths should be sanitized."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: fs.readFile($PATH, ...)
          - pattern: fs.readFileSync($PATH, ...)
          - pattern: fs.writeFile($PATH, ...)
          - pattern: fs.writeFileSync($PATH, ...)
    metadata:
      category: security
      cwe: "CWE-22: Path Traversal"

  - id: typescript-explicit-any
    languages: [typescript]
    message: "Avoid 'any' type. It disables type checking and can lead to security issues."
    severity: WARNING
    pattern: ": any"
    paths:
      exclude:
        - "*.test.ts"
        - "*.spec.ts"
        - "*.d.ts"
    metadata:
      category: security
      technology:
        - typescript

  - id: sql-injection-risk
    languages: [javascript, typescript]
    message: "Potential SQL injection. Use parameterized queries."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $DB.query(`... ${$VAR} ...`)
          - pattern: $DB.query("..." + $VAR + "...")
          - pattern: $DB.raw(`... ${$VAR} ...`)
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
